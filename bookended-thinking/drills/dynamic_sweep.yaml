# Drill 2 -- Dynamic sweep. Hold the layer fixed, vary the dynamic object.
#
# The dual of the layer sweep, and the one that tests whether the 30-cell
# operator block is uniform. kappa and gamma are NOT run as a sixth and seventh
# operator: doing that presupposes the homogeneity the drill exists to check.

id: dynamic_sweep
version: "0.6.2"
axis_exercised: dynamic
requires: [pole_classifier]
requires_not: [classifier_validation, resampling, rater_panel]

layer: "L4"
content: "The historical record is incomplete."

operator_arm:
  premise: "Five operators under one layer's conditions. All five predicted performable-within."
  tasks:
    - object: J_sharp
      instruction: "Carry the claim into the declared system without loss. What is conserved?"
    - object: G_sharp
      instruction: "Let the claim descend to a stable resting point in the system. Where does it settle?"
    - object: G_tilde_sharp
      instruction: "Confine the claim toward an end it does not reach. What is the attractor it never lands on?"
    - object: Sigma
      instruction: "Inject the new evidence the declared system did not anticipate. What couples?"
    - object: F
      instruction: "Let the system's output modify the system. What changes about the system itself?"
  check: "All five should classify distinctly at L4. Two that never separate are a finding about the axis, not about the student."

indicator_arm:
  object: kappa
  premise: |
    kappa is evaluated-under, not performed-within: a fail-only gate returning
    a verdict about what the layer admits. If that typing is right, the natural
    sentences come out as rejection verdicts rather than operations.
  instruction: "Give a kappa verdict at L4. Not what follows -- what is inadmissible, and on what ground."
  expected_form: rejection_verdict
  check: |
    Corroboration is the *form*: a sentence that reads "this derivation is
    inadmissible because it uses an undeclared primitive" is evaluated-under.
    A sentence that reads like an operation performed at L4 contradicts the
    typing and is recorded as such.

invariant_arm:
  object: gamma
  premise: |
    Do NOT force six sentences. The exercise is the inverse: attempt one and
    ask whether the attempt has a referent.
  instruction: "Attempt: 'the L4 layer instantiates gamma'. Then say whether that sentence refers to anything."
  expected_form: failure_to_construct
  check: |
    Failure to construct is the datum. "The trajectory exhibits curvature
    generated by the noncommutation of the operators" is a legitimate statement
    about gamma; "the forensic layer instantiates gamma" may be a category
    error. Success at constructing a fluent sentence is not evidence -- a
    fluent writer can nearly always write one, which is why the confirmatory
    direction of this test was rejected.

pre_registration:
  predicted: |
    Five operators separate. kappa produces rejection verdicts. gamma fails to
    construct at cell level.
  known_weakness: |
    The gamma arm is the weakest test in this tree. gamma's definition
    (computed from trajectories) is given to the classifier because without it
    the classifier could not recognise gamma at all -- and that definition is
    already close to the prediction under test. The gamma result is therefore
    softer evidence than the kappa result. Declared here rather than discovered
    later.
