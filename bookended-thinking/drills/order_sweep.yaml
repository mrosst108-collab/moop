# Drill 3 -- Order sweep. Hold the layer fixed, vary the order of composition.
#
# The only drill that can produce gamma evidence, and the only one whose
# negative result is informative in a specific direction. It exists because
# neither of the other two can see a path structure: a cell-level classifier is
# blind to both passage along the epistemic axis and composition along the
# dynamic one.

id: order_sweep
version: "0.6.2"
axis_exercised: composition
requires: [pole_classifier, bridge_classifier]
requires_not: [classifier_validation, rater_panel]

layer: "L4"
content: "The historical record is incomplete."

measurement: |
  The classifier never meets gamma in this drill. It types the constituent
  operation of each step -- one observed entry per step, in order -- and the
  engine composes the invariant afterwards (engine/trajectory.py). gamma is
  observationally historical: it is a property of two trajectories and their
  ordering, so no single classification can carry it, and asking a classifier
  to recognise it was the wrong abstraction. Recognition belongs to operators;
  measurement belongs to trajectory analysis.

  Two consequences of that decomposition, both enforced in the engine:

  * The endpoint is read off the LAYER, not the operator. The operator is how
    you moved; the layer is where you are. Arm A necessarily ends with the
    second declared operator and arm B with the other one, so an
    operator-valued endpoint would make every pair noncommute by construction
    -- a measurement of the experimental design rather than of the operators.
  * Order fidelity is checked per trajectory. A run that declared G# then G~#
    but was classified the other way round did not perform the order it
    declared; it is excluded and counted, never averaged in.

commutator_arm:
  premise: |
    gamma is defined as [G#, G~#]. That pair, and only that pair, tests gamma
    as defined. Any other pair tests order dependence in general, which may or
    may not be gamma -- a distinction worth keeping because a positive result
    on the wrong pair would be read as a gamma result. The engine refuses the
    gamma label for any pair that is not the defined commutator.
  runs:
    - order: [G_sharp, G_tilde_sharp]
      instruction: "Let the claim descend to a resting point; then confine the result toward an end it does not reach."
    - order: [G_tilde_sharp, G_sharp]
      instruction: "Confine the claim toward an end it does not reach; then let the result descend to a resting point."
  check: |
    Classify each step of both runs. The engine compares the endpoint
    distributions, and separately the route distributions, with a permutation
    test. Endpoints carry the commutator; routes differing while endpoints
    agree is not noncommutation, because two orders can trivially differ in the
    middle -- that is what ordering is.

cross_check:
  premise: |
    The cell-level and path-level results check each other, which neither does
    alone. The classifier still sees gamma as a bare label with no definition,
    so a cell-level gamma remains reportable and the void conjecture remains
    falsifiable.
  label_distribution: |
    A raw count of cell-level gamma labels under-determines the reading: a
    classifier tracking the ordering and a classifier repeating a habit produce
    the same count. The labels are therefore profiled per arm and compared, and
    the cross-check refuses a bare integer.
  readings:
    - when: "order effect, no cell typed gamma"
      reading: "path_level_supported -- gamma has a referent one level up; the cell ontology stays unresolved"
    - when: "no order effect, no cell typed gamma"
      reading: "gamma_inert -- the path-level proposal loses its only support"
    - when: "order effect, gamma labels covary with the ordering"
      reading: "classifier_relocated -- tracking the phenomenon, assigning it to the wrong level; a live ontology question"
    - when: "order effect, gamma labels at the same rate in both orders"
      reading: "label_habit -- labels indifferent to ordering alongside an effect they are not detecting"
    - when: "no order effect, gamma labels covary with the ordering"
      reading: "route_sensitive_labelling -- labels track the route while endpoints agree"
    - when: "no order effect, gamma labels at the same rate in both orders"
      reading: "label_without_operation -- typing on the name rather than the operation"

reporting: |
  The engine reports the observation and the inference as separate fields. The
  observation is an endpoint change under stated conditions; the inference is
  the gamma statement, and it exists only for the defined commutator. No code
  path renders a bare "gamma != 0" -- the general arm can establish order
  dependence and it cannot establish gamma.

general_arm:
  premise: "Order dependence beyond the defined commutator. Positive here is NOT a gamma result."
  runs:
    - order: [J_sharp, G_sharp]
      instruction: "Carry the claim into the system without loss; then let the result descend."
    - order: [G_sharp, J_sharp]
      instruction: "Let the claim descend; then carry the result into the system without loss."

pre_registration:
  predicted: "Order matters for the commutator arm. Undeclared for the general arm."
  informative_negative: |
    If order never changes the output, gamma is not merely unaddressable at
    cell level -- it is inert under the conditions tested, and the path-level
    proposal loses its only current support.
  resolution_limit: |
    Declared before running, or a null will be over-read. G# and G~# differ by a
    property of the flow -- convergent gradient descent versus non-convergent
    confinement -- not by what the sentence describes. In prose both read as
    narrowing. Failure to separate them is therefore ambiguous between "the
    ontology does not carve" and "prose cannot express this carve", and only
    the first would be a finding.

    Moving gamma into the engine does not lift this limit. It relocates the
    burden onto order fidelity: if the classifier cannot separate G# from G~#
    in prose, the fidelity check will fail or pass arbitrarily and the arms
    will not be what they claim. Excluded-trajectory counts are therefore the
    first thing to read, before any endpoint comparison.
  what_would_disambiguate: |
    Nothing available in this tree. It needs a representation in which the two
    flows differ observably, which is the representation problem the whole
    instrument is blocked on.

records:
  note: |
    Seal both orders as one commitment before either runs. Running one, reading
    it, then declaring the second is retrofitting, and the ledger refuses a
    response whose commitment is not already sealed.
